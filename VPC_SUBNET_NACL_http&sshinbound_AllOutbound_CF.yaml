Description: VPC with Network ACL rules Allow HTTP&SSH inbound and Allow internet outbound

Resources: # Define resouces - VPC1, Subnet1 named us-east-1a NACL with rules#
  MyTestVPC1: #name must not have any special chars HERE, if you want tochange, change in the Key : Name section#
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16 #You define as per the org's ips#
      EnableDnsSupport: true #For DNS resol#
      EnableDnsHostnames: true # For DHCP#
      Tags:
        - Key: Name
          Value: MyTest-VPC1 # Here you can have the name you wnat for your resource#

  MySubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyTestVPC1 # Ref fn, to refernce thsi subnet to the VPC1 #
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a #Choose you AZ#
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: MySubnet_1

  MyNetworkACLTestvpc1:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref MyTestVPC1
      Tags:
        - Key: Name
          Value: MyNACL-Testvpc1

  InboundSSHRule: # configure rules for your NACL of VPC1 #
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref MyNetworkACLTestvpc1 # This NACL lives/belongs to VPC1#
      RuleNumber: 100 #Any number works, but keep an eye, don't go random :) #
      Protocol: 6 # Protocol number for TCP is 6 , for UDP 17, for internet(i.e. for all to any protocol) -1 and for ICMP 1 #
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0 # Here you provide you Org's IP, I just let it to public 0.0.0.0/0 for this example #
      PortRange:
        From: 22
        To: 22

  InboundHTTPRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref MyNetworkACLTestvpc1
      RuleNumber: 110 # Follow the rule numbers, for ease #
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0 
      PortRange:
        From: 80 # You colud just use port 443 here. But you need to configure TLS certs in your Ec2/Webserver later.NACL is just a gate that just allows 443 or 80 #
        To: 80

  OutboundAllRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref MyNetworkACLTestvpc1
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  SubnetNACLAssociation: # Associating the NACL with our Subnet 1 of our VPC1, by associating this NACl to this subnet, it won't get a default NACL now#
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref MySubnet1
      NetworkAclId: !Ref MyNetworkACLTestvpc1

